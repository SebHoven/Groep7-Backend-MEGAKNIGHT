services:
  database:
    build: ./database
    container_name: schoolyard-db
    volumes:
      - db_data:/db
    networks:
      - schoolyard
    healthcheck:
      test: ["CMD", "test", "-f", "/db/groups.db"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build: ./apiGateway
    container_name: gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth:3015
      GROUPS_SERVICE_URL: http://groups:3012
      TASKS_SERVICE_URL: http://tasks:3013
      AVATAR_SERVICE_URL: http://avatar:3014
    depends_on:
      database:
        condition: service_healthy
      auth:
        condition: service_started
      groups:
        condition: service_started
      tasks:
        condition: service_started
      avatar:
        condition: service_started
    networks:
      - schoolyard

  auth:
    container_name: auth
    build: ./auth-service
    volumes:
      - ./auth-service/code:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - schoolyard
    ports:
      - "3015:3015"
    environment:
      GROUPS_SERVICE_URL: http://groups:3012
    depends_on:
      - groups
    working_dir: /usr/src/app
    command: npm run dev

  groups:
    container_name: groups
    build: ./groups
    volumes:
      - db_data:/db
    networks:
      - schoolyard
    ports:
      - "3012:3012"
    environment:
      DATABASE_URL: "file:/db/groups.db"
      PORT: 3012
      JWT_SECRET: "secretkey"
    depends_on:
      database:
        condition: service_healthy
    
  tasks:
    container_name: tasks
    build: ./tasks
    volumes:
      - ./tasks/code:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - schoolyard
    ports:
      - "3013:3013"
    environment:
      AUTH_SERVICE_URL: "http://auth:3015"
    working_dir: /usr/src/app
    command: npm run dev

  avatar:
    container_name: avatar
    build: ./avatar
    volumes:
      - ./avatar/code:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - schoolyard
    ports:
      - "3014:3014" 
    working_dir: /usr/src/app
    command: npm run dev

networks:
  schoolyard:
    driver: bridge

volumes:
  db_data:
  tasks-db:
  auth-db: